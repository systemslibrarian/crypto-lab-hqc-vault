name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # This lab has NO unit suite — no vitest, no node test scripts. Playwright
      # is its whole automated verification, and `test:a11y` is bare
      # `playwright test`, so it runs claims.spec.ts (clean roundtrips, the
      # targeted decode failure, the live error-budget sweep, the verifier's FO
      # accounting, the side-channel rows) alongside a11y.spec.ts. The old step
      # name advertised only the axe half, which is what makes a repo look like
      # it deploys on an a11y check alone. It does not — but if a unit suite is
      # ever added, it must be wired in here ahead of the build.
      - name: Browser claims and accessibility gate
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
